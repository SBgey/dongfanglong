name: dongfanglong

on:
  workflow_dispatch:
    inputs:
      kver:
        description: "内核版本，例如 6.12.9"
        required: true
        default: "6.12.9"
      imgsize:
        description: "根分区镜像大小（GB）"
        required: true
        default: "8"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc dwarves rsync cpio kmod zstd xz-utils curl ca-certificates \
            debootstrap e2fsprogs dosfstools

      - name: 下载内核源码
        run: |
          curl -fsSL -o linux.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ inputs.kver }}.tar.xz
          tar -xf linux.tar.xz
          mv linux-${{ inputs.kver }} linux
          rm -f linux.tar.xz

      - name: 配置内核
        working-directory: linux
        run: |
          make defconfig
          scripts/config --set-str CONFIG_LOCALVERSION "-dongfanglong"
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --enable  CONFIG_DEBUG_INFO_NONE
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --disable CONFIG_SYSTEM_TRUSTED_KEYS
          scripts/config --enable  CONFIG_IA32_EMULATION
          scripts/config --enable  CONFIG_USER_NS
          scripts/config --enable  CONFIG_SECCOMP
          scripts/config --enable  CONFIG_SECCOMP_FILTER
          scripts/config --enable  CONFIG_FUSE_FS
          scripts/config --enable  CONFIG_NTFS3_FS
          scripts/config --enable  CONFIG_BINFMT_MISC
          scripts/config --enable  CONFIG_EXT4_FS
          scripts/config --enable  CONFIG_DEVTMPFS
          scripts/config --enable  CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable  CONFIG_DRM
          scripts/config --enable  CONFIG_DRM_FBDEV_EMULATION
          make olddefconfig

      - name: 编译内核
        working-directory: linux
        run: make -j$(nproc) bzImage modules

      - name: 建立根文件系统
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase \
            --include=ca-certificates \
            bookworm "$PWD/rootfs" \
            http://mirrors.tuna.tsinghua.edu.cn/debian

      - name: 基础配置
        run: |
          R=$PWD/rootfs
          sudo tee $R/etc/apt/sources.list >/dev/null <<'EOF'
          deb http://mirrors.tuna.tsinghua.edu.cn/debian bookworm main contrib non-free non-free-firmware
          deb http://mirrors.tuna.tsinghua.edu.cn/debian bookworm-updates main contrib non-free non-free-firmware
          deb http://mirrors.tuna.tsinghua.edu.cn/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          sudo cp /etc/resolv.conf $R/etc/resolv.conf
          echo dongfanglong | sudo tee $R/etc/hostname >/dev/null
          sudo tee $R/etc/hosts >/dev/null <<'EOF'
          127.0.0.1 localhost
          127.0.1.1 dongfanglong
          ::1       localhost ip6-localhost ip6-loopback
          EOF
          sudo tee $R/etc/fstab >/dev/null <<'EOF'
          LABEL=dfl-root  /      ext4  errors=remount-ro                 0 1
          tmpfs           /tmp   tmpfs defaults,nosuid,nodev,size=1G     0 0
          EOF
          sudo mount --bind /dev  $R/dev
          sudo mount --bind /proc $R/proc
          sudo mount --bind /sys  $R/sys

      - name: 在 chroot 中安装桌面与 Wine
        run: |
          sudo chroot $PWD/rootfs /bin/bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            dpkg --add-architecture i386
            apt-get update
            apt-get install -y --no-install-recommends \
              systemd-sysv dbus systemd-timesyncd \
              xfce4 xfce4-terminal lightdm lightdm-gtk-greeter \
              xserver-xorg xserver-xorg-input-libinput \
              network-manager dbus-x11 fonts-wqy-zenhei \
              sudo curl ca-certificates \
              wine wine64 wine32 winetricks \
              libgl1-mesa-dri libgl1-mesa-dri:i386 \
              mesa-vulkan-drivers mesa-vulkan-drivers:i386
            apt-get clean
            rm -rf /var/lib/apt/lists/* /usr/share/doc/* /usr/share/man/* /usr/share/locale/*
            echo "root:dongfanglong" | chpasswd
            systemctl enable lightdm \
              || ln -sf /lib/systemd/system/lightdm.service \
                       /etc/systemd/system/display-manager.service
            systemctl enable NetworkManager || true
          '

      - name: 安装模块并生成 initramfs
        working-directory: linux
        run: |
          R=$GITHUB_WORKSPACE/rootfs
          sudo make INSTALL_MOD_PATH=$R modules_install
          KREL=$(make -s kernelrelease)
          echo "KREL=$KREL" >> $GITHUB_ENV
          sudo rm -f $R/lib/modules/$KREL/build $R/lib/modules/$KREL/source
          sudo cp -v arch/x86/boot/bzImage $R/boot/vmlinuz-$KREL
          sudo cp -v .config              $R/boot/config-$KREL
          sudo chroot $R mkinitramfs -o /boot/initrd.img-$KREL $KREL
          sudo cp -v $R/boot/initrd.img-$KREL $GITHUB_WORKSPACE/
          sudo cp -v arch/x86/boot/bzImage  $GITHUB_WORKSPACE/bzImage

      - name: 清理系统身份信息
        run: |
          R=$GITHUB_WORKSPACE/rootfs
          sudo rm -f $R/etc/machine-id $R/var/lib/dbus/machine-id
          sudo touch $R/etc/machine-id
          sudo chmod 444 $R/etc/machine-id

      - name: 生成根文件系统镜像
        run: |
          R=$GITHUB_WORKSPACE/rootfs
          truncate -s ${{ inputs.imgsize }}G dfl-root.img
          sudo mkfs.ext4 -q -L dfl-root -d $R dfl-root.img
          sudo chown $(id -u):$(id -g) dfl-root.img
          zstd -T0 -12 --long -o dfl.img.zst dfl-root.img
          ls -lh dfl-root.img dfl.img.zst
          sha256sum dfl.img.zst bzImage > SHA256SUMS
          ls -lh SHA256SUMS

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 东方龙 ${{ inputs.kver }}-dongfanglong
          body: |
            内核 ${{ inputs.kver }}-dongfanglong
            桌面 XFCE + Wine，root 密码 dongfanglong
            刷写方法见仓库内 install.sh
          files: |
            dfl.img.zst
            SHA256SUMS
            bzImage
            initrd.img-*
